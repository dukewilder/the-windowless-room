<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here &middot; The Windowless Room</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { --ink: #000000; --bone: #FFFFFF; --bone-dim: #8f8f8f; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--bone);
  font-family: Georgia, 'Times New Roman', serif;
  text-align: center; padding: 6vh 6vw;
}
h1 {
  margin: 0 0 1.4em; font-weight: 400;
  font-size: clamp(19px, 3.2vw, 31px);
  letter-spacing: .3em; padding-left: .3em; line-height: 1.5;
}
p { margin: 0 0 2.6em; font-size: clamp(14px, 1.6vw, 18px); color: var(--bone-dim); }
a {
  display: inline-block; border: 1px solid var(--bone);
  padding: .85em 1.7em; color: var(--bone); background: var(--ink);
  text-decoration: none; font-size: clamp(11px, 1.2vw, 14px);
  letter-spacing: .24em; padding-left: calc(1.7em + .24em);
  transition: background .18s ease, color .18s ease;
}
a:hover, a:focus-visible { background: var(--bone); color: #000000; }
</style>
</head>
<body>
<main>
  <h1>THERE IS NO PAGE HERE</h1>
  <p>You looked at a wall.</p>
  <a href="/">BACK TO THE ROOM</a>
</main>
</body>
</html>
