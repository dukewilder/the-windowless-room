  -webkit-user-select: none; user-select: none;
}

/* the room, drawn from the cover's own measurements. it does not move. */
#room { position: fixed; inset: 0; width: 100%; height: 100%; }

/* title and subtitle, above the ceiling line, as on the cover */
#mast {
  position: fixed; left: 0; right: 0; top: 7vh; text-align: center;
  pointer-events: none;
}
#mast h1 {
  margin: 0; font-weight: 400;
  font-size: clamp(23px, 4vw, 41px);
  letter-spacing: .3em; padding-left: .3em; line-height: 1.45;
}
#subtitle { margin: 15px 0 0; font-style: italic;
  font-size: clamp(15px, 1.6vw, 19px); color: #e8e8e8; }

/* four ways to the book. the dashed pair costs nothing.
   sizing is fluid rather than stepped, so the weight of the dock stays the
   same relative to the room whether it is four across or two by two. */
#dock {
  position: fixed; left: 0; right: 0; bottom: 10vh;
  display: flex; justify-content: center; align-items: stretch;
  gap: clamp(10px, 1.15vw, 24px); padding: 0 4vw;
}
.door {
  display: block;
  width: clamp(158px, 16.6vw, 300px);
  border: 1.5px solid rgba(255,255,255,.92);
  cursor: pointer; text-align: center;
  padding: clamp(13px, 1.7vw, 26px) 10px clamp(12px, 1.5vw, 23px);
  color: var(--bone); text-decoration: none; background: var(--ink);
  transition: background .18s ease, color .18s ease;
}
.door .main {
  display: block; line-height: 1.1;
  font-size: clamp(12.5px, 1.22vw, 20px);
  letter-spacing: .24em; padding-left: .24em;
}
.door .sub {
  display: block; margin-top: clamp(6px, .75vw, 13px);
  font-size: clamp(9.5px, .82vw, 13.5px);
  letter-spacing: .17em; padding-left: .17em;
  color: rgba(255,255,255,.62); transition: color .18s ease;
}
.door.free { border-style: dashed; }
.door.free .sub { color: rgba(255,255,255,.88); }
.door:hover, .door:focus-visible { background: var(--bone); color: #000000; }
.door:hover .sub, .door:focus-visible .sub { color: #000000; }
.door:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }

#whisper {
  position: fixed; left: 0; right: 0; bottom: 2.2vh; text-align: center;
  font-size: clamp(9.5px, .74vw, 13px); letter-spacing: .14em; color: var(--bone-dim);
}
/* the floorboards run under this line, so it gets a plate of its own,
   the same ink the buttons stand on */
#whisper span {
  display: inline-block; background: var(--ink);
  padding: 7px clamp(14px, 1.4vw, 22px) 6px;
}
#whisper a { color: inherit; text-decoration: none;
  border-bottom: 1px solid rgba(143,143,143,.45); }
#whisper a:hover, #whisper a:focus-visible { color: var(--bone); }

/* below this, four across stops fitting: two by two, and the type steps up
   with the buttons so they do not read as shrunken desktop ones */
@media (max-width: 1060px) {
  #dock {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(9px, 2.4vw, 16px);
    width: min(470px, 90vw); margin: 0 auto; padding: 0;
  }
  .door {
    width: auto;
    padding: clamp(12px, 2.6vw, 18px) 8px clamp(11px, 2.3vw, 16px);
  }
  .door .main { font-size: clamp(13px, 3.5vw, 17px); letter-spacing: .2em; padding-left: .2em; }
  .door .sub  { font-size: clamp(9.5px, 2.5vw, 12px); margin-top: clamp(6px, 1.4vw, 9px); }
}

@media (max-width: 900px), (max-aspect-ratio: 9/10) {
  #mast { top: 5vh; }
}
@media (max-height: 560px) {
  .door { padding: 10px 8px 9px; }
  .door .sub { margin-top: 5px; }
}
</style>

  /* the trace let the skirting run straight through three of the four legs.
     the cover does not: the line stops at the leg and picks up on the far side,
     because the leg is in front of the wall. these are those six crossings,
     each one the leg's own interior, measured off the trace. the third leg came
     off the art clean and is not here. */
  var LEG_SOLID = [
    [ 18.248,  27.264, 325.10, 328.80], [ 18.248,  27.264, 352.90, 356.60],
    [118.794, 126.144, 338.80, 341.90], [118.794, 126.144, 370.05, 373.80],
    [295.794, 303.144, 362.10, 365.70], [295.794, 303.144, 400.35, 403.90]
  ];

  /* the ink grows a stroke when the room is drawn small, so the patch grows
     with it: out at the top and bottom, in at the sides, by the same half
     weight, so the leg keeps its own two edges at every size. */
  function legSolid(ts) {
    var d = '', h = ts / 2;
    for (var i = 0; i < LEG_SOLID.length; i++) {
      var p = LEG_SOLID[i], x0 = p[0] + h, x1 = p[1] - h;
      if (x1 <= x0) continue;
      d += 'M' + x0.toFixed(3) + ',' + (p[2] - h).toFixed(3) +
           'H' + x1.toFixed(3) + 'V' + (p[3] + h).toFixed(3) +
           'H' + x0.toFixed(3) + 'Z';
    }
    return d;
  }

  var svg    = document.getElementById('room'),
      gWalls = document.getElementById('walls'),
      gFloor = document.getElementById('floor'),
      gStuff = document.getElementById('stuff');

  function mk(tag, parent, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }

  var wall = [], boards = [];
  for (var i = 0; i < 7; i++) wall.push(mk('path', gWalls, { fill: 'none' }));
  for (var i = 0; i < 31; i++) boards.push(mk('path', gFloor, {
    fill: 'none', stroke: 'rgba(255,255,255,.86)', 'stroke-width': 1 }));
  var tableBack  = mk('rect', gStuff, { fill: '#000' });
  var tableInk   = mk('path', gStuff, { d: TABLE.ink,   fill: '#fff', 'fill-rule': 'nonzero',
    stroke: '#fff', 'stroke-width': (LINE_ART - TRACE_FILL).toFixed(3), 'stroke-linejoin': 'round' });
  var legPatch   = mk('path', gStuff, { fill: '#000' });
  var crossInk   = mk('path', gStuff, { d: CROSS.ink,   fill: '#fff', 'fill-rule': 'nonzero',
    stroke: '#fff', 'stroke-width': (LINE_ART - TRACE_FILL).toFixed(3), 'stroke-linejoin': 'round' });

  var vw, vh, cx, k, vy, ceilY, skirtY, gap, artW;
  var dock = document.getElementById('dock');

  function resize() {
    vw = innerWidth; vh = innerHeight;
    cx = vw / 2;
    var mobile = vw < 900 || vh / vw > 10 / 9;
    var ceilF  = mobile ? 0.245 : 0.250,
        skirtF = mobile ? 0.560 : 0.690;
    var SPAN = D_SKIRT - D_CEIL;
    ceilY = ceilF * vh;
    k = Math.min((skirtF - ceilF) * vh / SPAN, vw / 2100);

    /* the floor has to hold the dock. on a squat viewport the room gives way
       rather than letting the buttons climb the wall. */
    dock.style.bottom = '';
    var dr = dock.getBoundingClientRect();
    var half = Math.max(Math.abs(dr.left - cx), Math.abs(dr.right - cx));
    var needed = dr.height + 0.133194 * half + 0.11 * vh + 26;
    var kMax = (vh - needed - ceilY) / SPAN;
    if (kMax > 0 && kMax < k) k = kMax;

    vy     = ceilY - D_CEIL * k;
    skirtY = vy + D_SKIRT * k;
    gap    = (D_SK2 - D_SKIRT) * k;   /* the skirting's own thickness, at the corner */
    artW   = Math.max(LINE_ART, MIN_PX / k);   /* one weight for room and furniture alike */
    svg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
    draw();
  }

  function draw() {
    var L = -cx, Rt = vw - cx, LW = (artW * k).toFixed(3);
    var d = [
      ['M 0 ' + (ceilY + CEIL_M_L * L) + ' L ' + cx + ' ' + ceilY, .92, LW],
      ['M ' + cx + ' ' + ceilY + ' L ' + vw + ' ' + (ceilY + CEIL_M_R * Rt), .92, LW],
      ['M 0 ' + (skirtY + SK1_M_L * L) + ' L ' + cx + ' ' + skirtY, .92, LW],
      ['M ' + cx + ' ' + skirtY + ' L ' + vw + ' ' + (skirtY + SK1_M_R * Rt), .92, LW],
      ['M 0 ' + (skirtY + gap + SK2_M_L * L) + ' L ' + cx + ' ' + (skirtY + gap), .92, LW],
      ['M ' + cx + ' ' + (skirtY + gap) + ' L ' + vw + ' ' + (skirtY + gap + SK2_M_R * Rt), .92, LW],
      ['M ' + cx + ' ' + ceilY + ' L ' + cx + ' ' + (vh + 40), .92, LW]
    ];
    for (var i = 0; i < d.length; i++) {
      wall[i].setAttribute('d', d[i][0]);
      wall[i].setAttribute('stroke', 'rgba(255,255,255,' + d[i][1] + ')');
      wall[i].setAttribute('stroke-width', d[i][2]);
    }

    /* the boards start where the floor starts: on the skirting, not below it */
    var n = 0, sy = BOARD_REF_Y * k, bot = vh + 60;
    for (var j = -15; j <= 15; j++) {
      if (!j || n >= boards.length) continue;
      var dxb = BOARD_PITCH * k * j;
      var m = (j < 0 ? SK2_M_L : SK2_M_R);
      var t0 = (skirtY + gap - vy) / (sy - m * dxb);       /* meets the skirting here */
      t0 *= 1 + 2.2 / Math.hypot(dxb * t0, sy * t0);       /* start just clear of it, so the
                                                             two strokes do not overlap into
                                                             a bright wedge at the junction */
      var t1 = (bot - vy) / sy;
      if (!(t0 > 0) || t0 >= t1) { boards[n++].setAttribute('d', ''); continue; }
      boards[n].setAttribute('stroke-width', artW * k);
      boards[n++].setAttribute('d',
        'M ' + (cx + dxb * t0).toFixed(1) + ' ' + (vy + sy * t0).toFixed(1) +
        ' L ' + (cx + dxb * t1).toFixed(1) + ' ' + (vy + sy * t1).toFixed(1));
    }
    for (; n < boards.length; n++) boards[n].setAttribute('d', '');

    var tt = 'translate(' + (cx + TABLE.dx * k).toFixed(2) + ',' + (vy + TABLE.dy * k).toFixed(2) + ') scale(' + k.toFixed(4) + ')';
    tableInk.setAttribute('transform', tt);
    var ts = Math.max(0, artW - TRACE_FILL);
    tableInk.setAttribute('stroke-width', ts.toFixed(3));
    crossInk.setAttribute('stroke-width', ts.toFixed(3));
    legPatch.setAttribute('transform', tt);
    legPatch.setAttribute('d', legSolid(ts));
    tableBack.setAttribute('transform', tt);
    tableBack.setAttribute('x', 0); tableBack.setAttribute('y', 0);
    tableBack.setAttribute('width', TABLE.w); tableBack.setAttribute('height', TABLE.h);
    crossInk.setAttribute('transform', 'translate(' + (cx + CROSS.dx * k).toFixed(2) + ',' +
      (vy + CROSS.dy * k).toFixed(2) + ') scale(' + k.toFixed(4) + ')');
    seatDock();
  }

  /* keep the dock standing on the floor: never riding up over the skirting,
     never crowding the line at the foot of the page */
  function seatDock() {
    dock.style.bottom = '';
    var r = dock.getBoundingClientRect();
    var half = Math.max(Math.abs(r.left - cx), Math.abs(r.right - cx));
    /* the skirting falls away from the corner, so the binding point is under
       the dock's outer edge, not under its middle */
    var under = skirtY + 0.133194 * half;
    var mobile = vw < 900 || vh / vw > 10 / 9;
    var ideal = (mobile ? 0.115 : 0.105) * vh;
    var floor = 0.045 * vh;
    var ceiling = vh - under - 20 - r.height;
    dock.style.bottom = Math.max(floor, Math.min(ideal, ceiling)).toFixed(1) + 'px';
  }

  console.log('No rights reserved.');
